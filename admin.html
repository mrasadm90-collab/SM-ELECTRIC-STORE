<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - SM Electric Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-8">
    <div class="max-w-4xl mx-auto space-y-8">
        <div class="flex justify-between items-center pb-4 border-b border-slate-800">
            <div>
                <h1 class="text-2xl font-black text-white">⚙️ Admin Control Panel</h1>
                <p class="text-xs text-slate-400">Manage store banners, deals, and products</p>
            </div>
            <a href="index.html" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl text-sm font-semibold text-slate-200 transition">← View Website</a>
        </div>

        <!-- Banner & Contact Settings -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-4">
            <h2 class="text-lg font-bold text-amber-400">Website Settings & Banner</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Announcement Banner Text</label>
                    <input type="text" id="announcement" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Owner / Contact Name</label>
                    <input type="text" id="owner" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">WhatsApp Number</label>
                    <input type="text" id="phone" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Store Address</label>
                    <input type="text" id="address" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                </div>
            </div>
            <button onclick="saveSettings()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-6 py-2.5 rounded-xl text-sm transition shadow-lg shadow-amber-500/20">Save General Settings</button>
        </div>

        <!-- Add New Product / Deal -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-4">
            <h2 class="text-lg font-bold text-amber-400">Add New Product or Deal</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <input type="text" id="p-name" placeholder="Product / Deal Name" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                <input type="text" id="p-price" placeholder="Regular Price (e.g. 4500)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                <input type="text" id="p-discount" placeholder="Discount Price (Leave empty if no discount)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                <input type="text" id="p-image" placeholder="Image URL (Link to the image)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                <textarea id="p-desc" placeholder="Product Features / Deal Details" class="w-full sm:col-span-2 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white h-24"></textarea>
            </div>
            <button onclick="addProduct()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-6 py-2.5 rounded-xl text-sm transition shadow-lg shadow-emerald-500/20">Add to Catalog</button>
        </div>

        <!-- Current Products List -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
            <h2 class="text-lg font-bold text-white mb-4">Current Catalog</h2>
            <div id="admin-products-list" class="space-y-4">
                <!-- Products loaded via Admin Panel will appear here -->
            </div>
        </div>
    </div>

    <script>
        // Load configurations
        const settings = JSON.parse(localStorage.getItem('sm_settings')) || {
            announcement: "⚡ SM Electric Store – Premier Electrical & Solar Supplies in Kasur",
            owner: "Mr. Asad Ali",
            phone: "03700390346",
            address: "Tehsil Dar Chowk, Kasur"
        };
        document.getElementById('announcement').value = settings.announcement;
        document.getElementById('owner').value = settings.owner;
        document.getElementById('phone').value = settings.phone;
        document.getElementById('address').value = settings.address;

        function saveSettings() {
            settings.announcement = document.getElementById('announcement').value;
            settings.owner = document.getElementById('owner').value;
            settings.phone = document.getElementById('phone').value;
            settings.address = document.getElementById('address').value;
            localStorage.setItem('sm_settings', JSON.stringify(settings));
            alert('General settings updated!');
        }

        function addProduct() {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const discount = document.getElementById('p-discount').value;
            const image = document.getElementById('p-image').value;
            const desc = document.getElementById('p-desc').value;
            
            if(!name || !price) {
                alert('Please enter product name and regular price!');
                return;
            }
            let products = JSON.parse(localStorage.getItem('sm_products')) || [];
            products.push({ name, price, discount, image, desc });
            localStorage.setItem('sm_products', JSON.stringify(products));
            alert('Product/Deal added successfully!');
            
            document.getElementById('p-name').value = '';
            document.getElementById('p-price').value = '';
            document.getElementById('p-discount').value = '';
            document.getElementById('p-image').value = '';
            document.getElementById('p-desc').value = '';
            loadAdminProducts();
        }

        function loadAdminProducts() {
            const products = JSON.parse(localStorage.getItem('sm_products')) || [];
            const list = document.getElementById('admin-products-list');
            list.innerHTML = "";
            products.forEach((p, index) => {
                list.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-950 border border-slate-800 p-4 rounded-xl">
                        <div>
                            <h4 class="font-bold text-white">${p.name}</h4>
                            <p class="text-xs text-amber-400">Price: Rs. ${p.price}</p>
                            ${p.discount ? `<p class="text-xs text-emerald-400">Discount: Rs. ${p.discount}</p>` : ''}
                        </div>
                        <button onclick="deleteProduct(${index})" class="bg-red-500 hover:bg-red-400 text-white font-bold px-4 py-2 rounded-lg text-xs transition">Delete</button>
                    </div>
                `;
            });
        }

        function deleteProduct(index) {
            let products = JSON.parse(localStorage.getItem('sm_products')) || [];
            products.splice(index, 1);
            localStorage.setItem('sm_products', JSON.stringify(products));
            loadAdminProducts();
        }

        loadAdminProducts();
    </script>
</body>
</html>
