<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - SM Electric Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-8">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
            <div>
                <h1 class="text-2xl font-black text-white">⚙️ Admin Control Panel</h1>
                <p class="text-xs text-slate-400">Manage SM Electric Store details & catalog</p>
            </div>
            <a href="index.html" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl text-sm font-semibold text-slate-200">← Back to Website</a>
        </div>

        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-6">
            <h2 class="text-lg font-bold text-amber-400">Store Configurations</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Store Name</label>
                    <input type="text" value="SM Electric Store" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Owner Name</label>
                    <input type="text" value="Mr. Asad Ali" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Phone / WhatsApp</label>
                    <input type="text" value="03700390346" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Address Location</label>
                    <input type="text" value="Tehsil Dar Chowk, Kasur" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white" />
                </div>
            </div>
            <button onclick="alert('Settings saved successfully!')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-6 py-2.5 rounded-xl text-sm transition shadow-lg">Save Changes</button>
        </div>
    </div>
</body>
</html>
